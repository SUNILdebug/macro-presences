<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Présence — Macroéconomie 3</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="student.js"></script>
</head>
<body>

<header class="topbar">
  <div>
    <strong>Macroéconomie 3</strong>
    <span class="topbar-sub">Validation Présence Étudiant</span>
  </div>
</header>

<main class="container student-container">
  <section class="panel narrow">
    
    <div id="sessionBadge" class="badge badge-neutral">Vérification de la séance…</div>
    
    <h1>Valider ma présence</h1>
    <p class="muted">Saisis ton Code Apogée, vérifie ton identité, puis entre le code affiché par le professeur.</p>

    <form id="attendanceForm">
      
      <div class="form-group">
        <label for="identifier">Code Apogée</label>
        <input id="identifier" type="text" placeholder="Ex. 20001234" required>
      </div>

      <button type="button" id="findStudentBtn" class="btn btn-secondary">Vérifier mon identité</button>

      <!-- CARTE D'IDENTITÉ ÉTUDIANT (AFFICHE NOM, PRÉNOM ET PARCOURS) -->
      <div id="identityCard" class="identity-card hidden"></div>

      <div class="form-group">
        <label for="confirmationCode">Code de confirmation (4 chiffres)</label>
        <input id="confirmationCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Ex. 1234" required>
      </div>

      <button id="validateBtn" class="btn btn-primary" type="submit">✓ Valider ma présence</button>

    </form>

    <div id="studentMsg" class="message hidden"></div>

  </section>
</main>

</body>
</html>
